name: Android APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create worldcup_app com.tazabazar.worldcup WorldCup2026
          cd worldcup_app
          cordova platform add android

      - name: Copy Source Files
        run: |
          cp -r worldcup_app_bundle/* worldcup_app/www/ || cp -r * worldcup_app/www/ || true

      - name: Build Android APK
        run: |
          cd worldcup_app
          cordova build android --apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: WorldCup-2026-App
          path: worldcup_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk

name: Android APK Build

on:
  push:
    branches: [ main, worldcup-app ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create build_dir com.worldcup.live "WorldCup 2026"
          cp -r worldcup_app/* build_dir/www/
          cd build_dir
          cordova platform add android

      - name: Build APK
        run: |
          cd build_dir
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: WorldCup-2026-App
          path: build_dir/platforms/android/app/build/outputs/apk/debug/*.apk

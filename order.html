<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f3d2e">
  <title>Secure Checkout | tazabazar.bd.com</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="luxury-site checkout-page">
  <nav class="luxury-nav"><a href="/" class="luxury-brand"><span>🥭</span><strong>tazabazar.bd.com</strong></a><div class="luxury-nav-links"><a href="/">Home</a><a href="/admin">Admin</a></div></nav>
  <main class="checkout-shell">
    <section class="checkout-card">
      <span class="gold-pill">Secure Advance Checkout</span>
      <h1>Manual Payment Confirmation</h1>
      <p>COD বন্ধ। bKash অথবা Nagad-এ পেমেন্ট করে Txnid দিয়ে অর্ডার কনফার্ম করুন।</p>
      <div id="checkoutItems" class="checkout-items"></div>
      <div class="checkout-total"><span>Total</span><strong id="checkoutTotal">৳0</strong></div>
    </section>

    <form class="checkout-card checkout-form" id="checkoutForm" novalidate>
      <div class="form-grid">
        <label>নাম<input id="customerName" required placeholder="আপনার নাম"></label>
        <label>ফোন<input id="phone" required placeholder="017XXXXXXXX"></label>
      </div>
      <label>ইমেইল (ঐচ্ছিক)<input id="email" type="email" placeholder="example@gmail.com"></label>
      <label>ঠিকানা<textarea id="address" required placeholder="বিস্তারিত ঠিকানা"></textarea></label>
      <label>পেমেন্ট পদ্ধতি<select id="paymentMethod" required><option value="" selected disabled>পেমেন্ট নির্বাচন করুন</option><option value="bkash">bKash Personal</option><option value="nagad">Nagad Personal</option></select></label>
      <div class="payment-box hidden" id="paymentBox"><span id="paymentLabel">Payment Number</span><strong id="paymentNumber">-</strong><small>Send Money করে নিচে Transaction ID লিখুন।</small></div>
      <label>Transaction ID / Txnid<input id="transactionId" required placeholder="Txnid লিখুন"></label>
      <label>নোট (ঐচ্ছিক)<textarea id="note" placeholder="বিশেষ নির্দেশনা"></textarea></label>
      <button class="btn btn-primary btn-block btn-lg" id="placeOrderBtn" disabled>Confirm Paid Order</button>
      <div class="checkout-message" id="checkoutMessage"></div>
    </form>
  </main>
  <a href="https://wa.me/8801629518850" class="whatsapp-float" target="_blank" rel="noopener">✆ <strong>WhatsApp</strong></a>
  <script src="js/shop.js"></script>
</body>
</html>
